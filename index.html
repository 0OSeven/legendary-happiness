<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Cert Prep — SHRM-CP · PHR · SPHR</title>
<style>
:root{
  --bg:#0f1117; --card:#181b25; --card2:#1f2330; --line:#2a2f40;
  --txt:#e8eaf2; --mut:#9aa1b5; --acc:#6c8cff; --acc2:#8b6cff;
  --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffb454; --mark:#4a3f14;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}
h1{font-size:20px;font-weight:700}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.certs{display:flex;gap:6px}
.certbtn{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600}
.certbtn.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:15px;margin-bottom:4px}
.card p{font-size:12.5px;color:var(--mut);line-height:1.45}
.mode{cursor:pointer;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--acc)}
.mode .ic{font-size:22px;margin-bottom:8px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:20px;display:block}
.stat span{font-size:11px;color:var(--mut)}
.dom{margin:6px 0}
.dom .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:3px}
.bar{height:7px;background:var(--card2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.qotd{border:1px solid var(--acc);cursor:pointer}
button.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-size:13px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--mut);flex-wrap:wrap;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.prog{height:5px;background:var(--card2);border-radius:3px;margin-bottom:16px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.qmeta{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.qtext{font-size:16px;line-height:1.55;margin-bottom:16px;user-select:text}
.qtext mark{background:var(--mark);color:#ffe08a;border-radius:3px;padding:0 2px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tool{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer}
.tool.on{border-color:var(--warn);color:var(--warn)}
.opt{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;line-height:1.45;position:relative}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--card2)}
.opt.correct{border-color:var(--ok);background:rgba(62,207,142,.08)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.07)}
.opt.struck .otext{text-decoration:line-through;opacity:.4}
.opt .letter{font-weight:700;color:var(--mut);min-width:18px}
.opt .strike{margin-left:auto;font-size:12px;color:var(--mut);opacity:.5;padding:0 4px;flex-shrink:0}
.opt .strike:hover{opacity:1;color:var(--bad)}
.expl{background:var(--card2);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:14px;font-size:13.5px;line-height:1.6;color:var(--txt);margin:12px 0}
.expl b{color:var(--acc)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.bookmark{cursor:pointer;font-size:20px;color:var(--mut)}
.bookmark.on{color:var(--warn)}
/* results */
.score-big{font-size:44px;font-weight:800;text-align:center;margin:10px 0}
.score-sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:18px}
.rv{border-bottom:1px solid var(--line);padding:12px 0;font-size:13.5px}
.rv .q{margin-bottom:6px;line-height:1.5}
.rv .a{color:var(--mut);font-size:12.5px;line-height:1.5}
.ok{color:var(--ok)} .bad{color:var(--bad)}
/* custom builder */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer}
.ck.on{border-color:var(--acc);color:var(--txt)}
select,input[type=number]{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px}
.levels{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.lvl{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;position:relative}
.lvl.done{border-color:var(--ok);color:var(--ok)}
.lvl.locked{opacity:.35;cursor:not-allowed}
.back{color:var(--mut);cursor:pointer;font-size:13px;margin-bottom:14px;display:inline-block}
.back:hover{color:var(--txt)}
.empty{color:var(--mut);font-size:13px;padding:20px;text-align:center}
.note{font-size:11.5px;color:var(--mut);margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="questions.js"></script>
<script>
const $=s=>document.querySelector(s);
const APP=$('#app');
const DOM=window.QMETA.domains, BP=window.QMETA.blueprints, BANK=window.QBANK;
const LETTERS=['A','B','C','D'];

// ---------- state / storage ----------
const store={
  get(k,d){try{const v=localStorage.getItem('hrprep_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){localStorage.setItem('hrprep_'+k,JSON.stringify(v))}
};
let cert=store.get('cert','SHRM-CP');
let stats=store.get('stats',{});           // {qid:{c:correct,w:wrong,last:0|1}}
let bookmarks=store.get('bookmarks',[]);
let levelProg=store.get('levelProg',{});   // {cert:maxUnlocked}
let streak=store.get('streak',{last:null,n:0});

function touchStreak(){
  const today=new Date().toDateString();
  if(streak.last===today)return;
  const yd=new Date(Date.now()-864e5).toDateString();
  streak={last:today,n:streak.last===yd?streak.n+1:1};
  store.set('streak',streak);
}
function rec(qid,ok){
  const s=stats[qid]||{c:0,w:0};
  ok?s.c++:s.w++; s.last=ok?1:0; stats[qid]=s; store.set('stats',stats);
}
function certBank(){return BANK.filter(q=>q.cert.includes(cert))}
function domStats(){
  const out={};
  for(const d in DOM){out[d]={c:0,t:0}}
  certBank().forEach(q=>{const s=stats[q.id];if(s){out[q.d].c+=s.c;out[q.d].t+=s.c+s.w}});
  return out;
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// explanations reference options by letter in original order; remap to the shuffled display order
function mapEx(ex,perm){
  return ex.replace(/\(([^)]*)\)/g,(m,inner)=>'('+inner.replace(/\b([A-D])\b/g,l=>LETTERS[perm.indexOf(l.charCodeAt(0)-65)])+')');
}

// blueprint-weighted picker: composition of every test follows the cert's exam weights
function pickByBlueprint(n,pool){
  pool=pool||certBank();
  const w=BP[cert].w, doms=Object.keys(w).filter(d=>w[d]>0);
  const tot=doms.reduce((s,d)=>s+w[d],0);
  let picked=[];
  // fewest-seen-first inside each domain so the bank rotates like Pocket Prep
  const seen=q=>{const s=stats[q.id];return s?s.c+s.w:0};
  doms.forEach(d=>{
    const want=Math.round(n*w[d]/tot);
    const dp=shuffle(pool.filter(q=>q.d===d)).sort((a,b)=>seen(a)-seen(b));
    picked.push(...dp.slice(0,want));
  });
  // top up / trim to exactly n
  if(picked.length<n){
    const ids=new Set(picked.map(q=>q.id));
    const rest=shuffle(pool.filter(q=>!ids.has(q.id))).sort((a,b)=>seen(a)-seen(b));
    picked.push(...rest.slice(0,n-picked.length));
  }
  return shuffle(picked.slice(0,n));
}

// ---------- views ----------
function home(){
  touchStreak();
  const bank=certBank(), ds=domStats();
  const answered=Object.keys(stats).filter(id=>bank.some(q=>q.id===id)).length;
  const correct=bank.reduce((s,q)=>s+(stats[q.id]?stats[q.id].c:0),0);
  const total=bank.reduce((s,q)=>s+(stats[q.id]?stats[q.id].c+stats[q.id].w:0),0);
  const acc=total?Math.round(100*correct/total):0;
  const missed=bank.filter(q=>stats[q.id]&&stats[q.id].last===0).length;
  // QOTD deterministic by date
  const dayIdx=Math.floor(Date.now()/864e5)%bank.length;

  APP.innerHTML=`
  <header>
    <h1>HR Cert Prep <span>· 2026</span></h1>
    <div class="certs">${Object.keys(BP).map(c=>`<button class="certbtn ${c===cert?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
  </header>
  <div class="statrow">
    <div class="stat"><b>${streak.n}🔥</b><span>day streak</span></div>
    <div class="stat"><b>${answered}/${bank.length}</b><span>questions seen</span></div>
    <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
    <div class="stat"><b>${missed}</b><span>to review</span></div>
  </div>
  <div class="card qotd mode" id="qotd" style="margin-bottom:12px">
    <h3>⭐ Question of the Day</h3>
    <p>${bank[dayIdx].q.slice(0,110)}…</p>
  </div>
  <div class="grid">
    <div class="card mode" data-m="quick"><div class="ic">⚡</div><h3>Quick 10</h3><p>10 blueprint-weighted questions with instant feedback and full explanations.</p></div>
    <div class="card mode" data-m="levels"><div class="ic">🪜</div><h3>Level Up</h3><p>Climb difficulty levels 1–7. Score 70%+ to unlock the next level — start here.</p></div>
    <div class="card mode" data-m="weak"><div class="ic">🎯</div><h3>Weakest Subject</h3><p>Auto-targets your lowest-scoring domain to close the gap.</p></div>
    <div class="card mode" data-m="missed"><div class="ic">🔁</div><h3>Missed Questions</h3><p>Retry every question you got wrong last time (${missed} waiting).</p></div>
    <div class="card mode" data-m="custom"><div class="ic">🛠️</div><h3>Build Your Own</h3><p>Pick domains, question count, and knowledge vs. situational.</p></div>
    <div class="card mode" data-m="exam"><div class="ic">⏱️</div><h3>Exam Simulator</h3><p>${BP[cert].examQ} questions · ${Math.floor(BP[cert].examMin/60)}h ${BP[cert].examMin%60}m timer · feedback at the end, like test day.</p></div>
    <div class="card mode" data-m="marks"><div class="ic">🔖</div><h3>Bookmarked</h3><p>Drill the questions you flagged (${bookmarks.length} saved).</p></div>
    <div class="card mode" data-m="state"><div class="ic">🗽</div><h3>NY / CA State Law</h3><p>Bonus bank for New York &amp; California practice — daily OT, PFL, pay transparency, PAGA, WARN and more. Not on the national exams, but on the job.</p></div>
  </div>
  <h3 style="margin:20px 0 8px;font-size:14px">Mastery by domain — ${cert}</h3>
  <div class="card">${Object.keys(DOM).filter(d=>BP[cert].w[d]>0||bank.some(q=>q.d===d)).map(d=>{
    const s=ds[d],p=s.t?Math.round(100*s.c/s.t):0;
    return `<div class="dom"><div class="lbl"><span>${DOM[d]}</span><span>${s.t?p+'% ('+s.c+'/'+s.t+')':'not started'}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join('')}</div>
  <p class="note">Every quiz is auto-composed to match the real ${cert} exam blueprint weights. Bank: ${bank.length} questions for ${cert} (${BANK.length} total). Tip from test-takers: use ✕ to strike out wrong answers and the highlighter on long questions — the real Prometric interface has both.</p>`;

  document.querySelectorAll('.certbtn').forEach(b=>b.onclick=()=>{cert=b.dataset.c;store.set('cert',cert);home()});
  document.querySelectorAll('.mode[data-m]').forEach(b=>b.onclick=()=>route(b.dataset.m));
  $('#qotd').onclick=()=>startQuiz([bank[dayIdx]],{title:'Question of the Day'});
}

function route(m){
  const bank=certBank();
  if(m==='quick')startQuiz(pickByBlueprint(10),{title:'Quick 10'});
  else if(m==='levels')levelsView();
  else if(m==='weak'){
    const ds=domStats();let worst=null,wp=101;
    Object.keys(ds).forEach(d=>{if(BP[cert].w[d]>0&&ds[d].t>0){const p=100*ds[d].c/ds[d].t;if(p<wp){wp=p;worst=d}}});
    if(!worst){alert('Answer some questions first so I can find your weak spot!');return}
    startQuiz(shuffle(bank.filter(q=>q.d===worst)).slice(0,10),{title:'Weakest: '+DOM[worst]});
  }
  else if(m==='missed'){
    const qs=shuffle(bank.filter(q=>stats[q.id]&&stats[q.id].last===0)).slice(0,20);
    if(!qs.length){alert('Nothing to review — no missed questions. 🎉');return}
    startQuiz(qs,{title:'Missed Questions'});
  }
  else if(m==='custom')customView();
  else if(m==='exam')startQuiz(pickByBlueprint(Math.min(BP[cert].examQ,bank.length)),{title:cert+' Exam Simulator',exam:true,minutes:BP[cert].examMin});
  else if(m==='marks'){
    const qs=bank.filter(q=>bookmarks.includes(q.id));
    if(!qs.length){alert('No bookmarks yet — flag questions with 🔖 during quizzes.');return}
    startQuiz(shuffle(qs),{title:'Bookmarked'});
  }
  else if(m==='state'){
    const seen=q=>{const s=stats[q.id];return s?s.c+s.w:0};
    const qs=shuffle(bank.filter(q=>q.d==='SL')).sort((a,b)=>seen(a)-seen(b)).slice(0,10);
    if(!qs.length){alert('No state law questions in the bank yet.');return}
    startQuiz(shuffle(qs),{title:'NY/CA State Law'});
  }
}

function levelsView(){
  const max=levelProg[cert]||1;
  APP.innerHTML=`<span class="back" onclick="home()">← Back</span>
  <h1 style="margin-bottom:6px">🪜 Level Up — ${cert}</h1>
  <p style="color:var(--mut);font-size:13px;margin-bottom:14px">Levels 1–2 build fundamentals, 5–6 mimic real exam distractors, 7 is expert. Score 70%+ on a 10-question set to unlock the next level.</p>
  <div class="levels">${[1,2,3,4,5,6,7].map(l=>{
    const locked=l>max, done=l<max;
    return `<div class="lvl ${done?'done':''} ${locked?'locked':''}" data-l="${l}">${locked?'🔒':l}</div>`;
  }).join('')}</div>`;
  document.querySelectorAll('.lvl:not(.locked)').forEach(el=>el.onclick=()=>{
    const l=+el.dataset.l;
    let qs=certBank().filter(q=>q.lv===l);
    if(qs.length<10)qs=qs.concat(certBank().filter(q=>Math.abs(q.lv-l)===1));
    startQuiz(shuffle(qs).slice(0,10),{title:'Level '+l,level:l});
  });
}

function customView(){
  const doms=Object.keys(DOM).filter(d=>BP[cert].w[d]>0||certBank().some(q=>q.d===d));
  APP.innerHTML=`<span class="back" onclick="home()">← Back</span>
  <h1 style="margin-bottom:14px">🛠️ Build Your Own Quiz</h1>
  <div class="card">
    <div class="field"><label>Domains</label><div class="checks" id="doms">${doms.map(d=>`<span class="ck on" data-d="${d}">${DOM[d]}</span>`).join('')}</div></div>
    <div class="field"><label>Question type</label><div class="checks" id="types">
      <span class="ck on" data-t="k">Knowledge</span><span class="ck on" data-t="s">Situational</span></div></div>
    <div class="field"><label>How many questions</label><select id="cnt"><option>5</option><option selected>10</option><option>15</option><option>25</option><option>50</option></select></div>
    <button class="primary" id="go">Start quiz</button>
  </div>`;
  document.querySelectorAll('.ck').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  $('#go').onclick=()=>{
    const ds=[...document.querySelectorAll('#doms .ck.on')].map(c=>c.dataset.d);
    const ts=[...document.querySelectorAll('#types .ck.on')].map(c=>c.dataset.t);
    const qs=shuffle(certBank().filter(q=>ds.includes(q.d)&&ts.includes(q.t))).slice(0,+$('#cnt').value);
    if(!qs.length){alert('No questions match those filters.');return}
    startQuiz(qs,{title:'Custom Quiz'});
  };
}

// ---------- quiz engine ----------
let Q={};
function startQuiz(qs,opt){
  if(!qs.length)return;
  Q={qs,i:0,answers:new Array(qs.length).fill(null),opt,hl:false,struck:{},t0:Date.now(),timer:null,left:(opt.minutes||0)*60,
     perm:qs.map(()=>shuffle([0,1,2,3]))}; // shuffle answer positions so correct letters vary
  if(opt.exam){Q.timer=setInterval(()=>{Q.left--;const el=$('#tm');if(el)el.textContent=fmtT(Q.left);if(Q.left<=0){clearInterval(Q.timer);finish()}},1000)}
  renderQ();
}
function fmtT(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function renderQ(){
  const q=Q.qs[Q.i], ans=Q.answers[Q.i], answered=ans!==null && !Q.opt.exam;
  const struck=Q.struck[Q.i]||[], perm=Q.perm[Q.i];
  const dispLetter=orig=>LETTERS[perm.indexOf(orig)];
  APP.innerHTML=`
  <div class="qtop">
    <span class="back" id="quit">✕ ${Q.opt.exam?'End exam':'Quit'}</span>
    <span>${Q.opt.title} — ${Q.i+1} / ${Q.qs.length}</span>
    ${Q.opt.exam?`<span class="timer" id="tm">${fmtT(Q.left)}</span>`:`<span></span>`}
  </div>
  <div class="prog"><i style="width:${(Q.i)/Q.qs.length*100}%"></i></div>
  <div class="qmeta">
    <span class="chip">${DOM[q.d]}</span><span class="chip">Level ${q.lv}</span>
    <span class="chip">${q.t==='s'?'Situational':'Knowledge'}</span>
    <span class="bookmark ${bookmarks.includes(q.id)?'on':''}" id="bk" title="Bookmark">🔖</span>
  </div>
  <div class="tools">
    <span class="tool ${Q.hl?'on':''}" id="hlt">🖍 Highlight ${Q.hl?'ON — select text':''}</span>
  </div>
  <div class="qtext" id="qtext">${q.q}</div>
  <div id="opts">${perm.map((idx,pos)=>{
    const o=q.o[idx];
    let cls='opt';
    if(struck.includes(idx))cls+=' struck';
    if(Q.opt.exam){if(ans===idx)cls+=' sel'}
    else if(ans!==null){if(idx===q.a)cls+=' correct';else if(idx===ans)cls+=' wrong'}
    return `<div class="${cls}" data-i="${idx}"><span class="letter">${LETTERS[pos]}.</span><span class="otext">${o}</span><span class="strike" data-s="${idx}" title="Strike out">✕</span></div>`;
  }).join('')}</div>
  ${answered?`<div class="expl"><b>${ans===q.a?'✔ Correct.':'✘ Not quite — the answer is '+dispLetter(q.a)+'.'}</b> ${mapEx(q.ex,perm)}</div>`:''}
  <div class="qnav">
    <button class="ghost" id="prev" ${Q.i===0?'disabled':''}>← Prev</button>
    ${Q.opt.exam
      ? (Q.i===Q.qs.length-1?`<button class="primary" id="fin">Submit exam</button>`:`<button class="primary" id="next">Next →</button>`)
      : (answered?(Q.i===Q.qs.length-1?`<button class="primary" id="fin">See results</button>`:`<button class="primary" id="next">Next →</button>`):`<span style="color:var(--mut);font-size:12px">choose an answer</span>`)}
  </div>`;

  $('#quit').onclick=()=>{if(confirm('Leave this quiz? Progress on unanswered questions is lost.')){if(Q.timer)clearInterval(Q.timer);home()}};
  $('#bk').onclick=e=>{
    const i=bookmarks.indexOf(q.id);
    i>=0?bookmarks.splice(i,1):bookmarks.push(q.id);
    store.set('bookmarks',bookmarks);e.target.classList.toggle('on');
  };
  $('#hlt').onclick=()=>{Q.hl=!Q.hl;renderQ()};
  $('#qtext').onmouseup=()=>{
    if(!Q.hl)return;
    const sel=window.getSelection();
    if(sel.rangeCount&&!sel.isCollapsed){
      try{const r=sel.getRangeAt(0);const m=document.createElement('mark');r.surroundContents(m);sel.removeAllRanges()}catch(e){}
    }
  };
  document.querySelectorAll('.strike').forEach(s=>s.onclick=e=>{
    e.stopPropagation();
    const idx=+s.dataset.s, arr=Q.struck[Q.i]=Q.struck[Q.i]||[];
    const p=arr.indexOf(idx);p>=0?arr.splice(p,1):arr.push(idx);
    renderQ();
  });
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    const idx=+o.dataset.i;
    if(Q.opt.exam){Q.answers[Q.i]=idx;renderQ();return}
    if(Q.answers[Q.i]!==null)return;
    Q.answers[Q.i]=idx;rec(q.id,idx===q.a);renderQ();
  });
  const nx=$('#next');if(nx)nx.onclick=()=>{Q.i++;renderQ()};
  const pv=$('#prev');if(pv)pv.onclick=()=>{Q.i--;renderQ()};
  const fn=$('#fin');if(fn)fn.onclick=finish;
}
function finish(){
  if(Q.timer)clearInterval(Q.timer);
  if(Q.opt.exam){Q.qs.forEach((q,i)=>{if(Q.answers[i]!==null)rec(q.id,Q.answers[i]===q.a)})}
  const n=Q.qs.length, right=Q.qs.filter((q,i)=>Q.answers[i]===q.a).length;
  const pct=Math.round(100*right/n);
  // level unlock
  let unlocked='';
  if(Q.opt.level&&pct>=70){
    const cur=levelProg[cert]||1;
    if(Q.opt.level>=cur&&cur<7){levelProg[cert]=Q.opt.level+1;store.set('levelProg',levelProg);unlocked=`<p style="text-align:center;color:var(--ok);font-size:14px;margin-bottom:12px">🎉 Level ${Q.opt.level+1} unlocked!</p>`}
  }
  const byDom={};
  Q.qs.forEach((q,i)=>{byDom[q.d]=byDom[q.d]||{c:0,t:0};byDom[q.d].t++;if(Q.answers[i]===q.a)byDom[q.d].c++});
  const mins=Math.round((Date.now()-Q.t0)/60000);
  APP.innerHTML=`
  <span class="back" onclick="home()">← Home</span>
  <div class="score-big" style="color:${pct>=70?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)'}">${pct}%</div>
  <div class="score-sub">${right} of ${n} correct · ${Q.opt.title} · ${mins} min${pct>=70?' · passing pace ✔':''}</div>
  ${unlocked}
  <div class="card" style="margin-bottom:14px">${Object.keys(byDom).map(d=>{
    const s=byDom[d],p=Math.round(100*s.c/s.t);
    return `<div class="dom"><div class="lbl"><span>${DOM[d]}</span><span>${s.c}/${s.t}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join('')}</div>
  <h3 style="font-size:14px;margin-bottom:6px">Review</h3>
  <div class="card">${Q.qs.map((q,i)=>{
    const a=Q.answers[i],ok=a===q.a,pm=Q.perm[i];
    return `<div class="rv"><div class="q">${ok?'<span class="ok">✔</span>':'<span class="bad">✘</span>'} ${q.q}</div>
    <div class="a">Your answer: ${a!==null?LETTERS[pm.indexOf(a)]+'. '+q.o[a]:'—'} ${ok?'':'<br>Correct: '+LETTERS[pm.indexOf(q.a)]+'. '+q.o[q.a]}<br><i>${mapEx(q.ex,pm)}</i></div></div>`;
  }).join('')}</div>
  <div style="text-align:center;margin-top:18px"><button class="primary" onclick="home()">Back to dashboard</button></div>`;
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
